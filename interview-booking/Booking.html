<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Schedule an interview</title><style>body{font:1rem/1.6 system-ui;max-width:34rem;margin:3rem auto;padding:1rem;color:#19324b}label{display:block;margin:1rem 0}input,select,button{display:block;font:inherit;padding:.45rem}button{cursor:pointer}</style><h1>Schedule an interview</h1><p>Choose up to three hours on Tuesday or Thursday, between 2 and 5 PM Eastern. Book at least 24 hours ahead.</p><div id="g_id_onload" data-client_id="<?= clientId ?>" data-callback="signedIn"></div><div class="g_id_signin" data-type="standard"></div><form id="booking"><label>Date<input name="date" type="date" required></label><label>Start (Eastern)<input name="start" type="time" min="14:00" max="16:59" required></label><label>End (Eastern)<input name="end" type="time" min="14:01" max="17:00" required></label><label>Format<select name="format"><option>Google Meet</option><option>In person</option></select></label><label id="place" hidden>Meeting address<input name="address" maxlength="300" disabled></label><button disabled>Reserve interview</button><p role="status" id="status"></p></form><style>[hidden]{display:none}</style><script>
const form=document.querySelector('form'), submit=form.querySelector('button'), fields=form.elements, message=document.getElementById('status');let token='';
function signedIn(result){token=result.credential;submit.disabled=false}
fields.format.onchange=()=>{const show=fields.format.value==='In person';document.getElementById('place').hidden=!show;fields.address.disabled=!show;fields.address.required=show};
form.onsubmit=e=>{e.preventDefault();submit.disabled=true;message.textContent='Checking availability…';google.script.run.withSuccessHandler(result=>{message.textContent=result;form.hidden=true;form.after(message)}).withFailureHandler(err=>{message.textContent=err.message;submit.disabled=false}).reserve({...Object.fromEntries(new FormData(form)),token})};
</script><script src="https://accounts.google.com/gsi/client" async defer></script></html>
